services:
  api:
    container_name: category-crud
    build:
      context: .
      target: production
    env_file:
      - .env
    depends_on:
      - mongo
    networks:
      - category-api-network
  mongo:
    image: mongo:7
    container_name: category-crud-mongo
    volumes:
      - mongodb_data_container:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - ${MONGO_PORT}:27017
    networks:
      - category-api-network
  frontend:
    container_name: category-crud-frontend
    build:
      context: ./frontend
      target: production
    depends_on:
      - api
    ports:
      - ${FRONTEND_PORT}:80
    networks:
      - category-api-network

networks:
  category-api-network:
volumes:
  mongodb_data_container:
